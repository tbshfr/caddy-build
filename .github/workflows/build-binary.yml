name: Build Caddy

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CADDY_VERSION: v2.11.7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: stable

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@e0e8f68a0f4bef11bfd04c4fb3091052ad36132f # v0.4.7

      - name: Build Caddy (with static adapter)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          xcaddy build "$CADDY_VERSION" \
            --with github.com/tbshfr/caddy-static-adapter@4620186a944e2a7d19e56301038f5aeae58afc45 \
            --output caddy-static-linux-amd64

      - name: Build Caddy (with netacl)
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          xcaddy build "$CADDY_VERSION" \
            --with github.com/tbshfr/caddy-netacl@76425691ed8808c9a643b58d16f650e2fe5d5363 \
            --output caddy-netacl-linux-amd64

      - name: Verify modules
        run: |
          ./caddy-static-linux-amd64 version
          ./caddy-static-linux-amd64 list-modules --packages | grep -q 'tbshfr/caddy-static-adapter'
          ! ./caddy-static-linux-amd64 list-modules --packages | grep -q 'tbshfr/caddy-netacl'

          ./caddy-netacl-linux-amd64 version
          ./caddy-netacl-linux-amd64 list-modules --packages | grep -q 'tbshfr/caddy-netacl'
          ! ./caddy-netacl-linux-amd64 list-modules --packages | grep -q 'tbshfr/caddy-static-adapter'

      - name: Generate checksums
        run: sha256sum caddy-*-linux-amd64 > sha256sums.txt

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            caddy-static-linux-amd64
            caddy-netacl-linux-amd64
            sha256sums.txt
          generate_release_notes: true